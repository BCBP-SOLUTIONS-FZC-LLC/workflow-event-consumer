{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "workflow-events-consumer.fullname" . }}
  labels:
    {{- include "workflow-events-consumer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "workflow-events-consumer.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Same-namespace pods (service-to-service) and the monitoring namespace's
    # Prometheus, scraping /metrics only. This service serves no other
    # inbound HTTP surface.
    - from:
        - podSelector: {}
      ports:
        - port: http
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - port: http
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS — SQS API calls (and any https forward target).
    # These targets' addrs are config-driven (config/topology.yaml), so this
    # policy can't scope by hostname; narrow further with additionalEgressRules
    # (a namespaceSelector/ipBlock) if the two downstream services' network
    # location is known ahead of time.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
    # The forward targets are in-cluster services on plain HTTP (their `addr` names a port).
    - to:
        - namespaceSelector: {}
      ports:
        {{- range .Values.networkPolicy.targetPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- with .Values.networkPolicy.additionalEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
