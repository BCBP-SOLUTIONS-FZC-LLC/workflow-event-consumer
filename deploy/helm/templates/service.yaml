apiVersion: v1
kind: Service
metadata:
  name: {{ include "workflow-events-consumer.fullname" . }}
  labels:
    {{- include "workflow-events-consumer.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "workflow-events-consumer.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
