{{- if not .Values.existingSecret }}
{{- range $k, $v := .Values.secretValues }}
{{- if not $v }}
{{- fail (printf "secretValues.%s is required when existingSecret is not set" $k) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workflow-events-consumer.fullname" . }}
  labels:
    {{- include "workflow-events-consumer.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- toYaml .Values.secretValues | nindent 2 }}
{{- end }}
