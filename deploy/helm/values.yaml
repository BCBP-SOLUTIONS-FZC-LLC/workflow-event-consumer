image:
  repository: ghcr.io/bcbp-solutions-fzc-llc/workflow-events-consumer
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

service:
  port: 8082

terminationGracePeriodSeconds: 90

# Fixed on purpose: the Deployment, Service and ServiceAccount render as workflow-events-consumer
# whatever the release is called, so the caller lists in the Definition, Execution and Stream Gateway
# charts (their AuthorizationPolicy names this ServiceAccount) stay true. Install one release per namespace.
fullnameOverride: workflow-events-consumer

# The pods always run as the ServiceAccount named like fullnameOverride, whatever the release is called:
# the other charts' AuthorizationPolicies admit this caller by that name. A different serviceAccount.name
# is refused at render. With create: false the account is managed elsewhere and must already exist.
serviceAccount:
  create: true
  name: ""
  annotations: {}  # e.g. eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/workflow-events-consumer

# Settings passed to the container as environment variables. No secret belongs here.
env:
  APP_ENV: prod
  AWS_REGION: us-east-1
  TOPOLOGY_CONFIG_PATH: /etc/event-consumer/topology.yaml
  CONSUMER_CONCURRENCY: "10"
  VISIBILITY_TIMEOUT: 30s
  DRAIN_TIMEOUT: 30s
  FORWARD_TIMEOUT: 5s
  HANDLER_TIMEOUT: 20s
  RETRY_BACKOFF_BASE: 30s
  RETRY_BACKOFF_MAX: 5m
  MAX_RECEIVE_COUNT: "4"
  RECEIVE_STALL_WINDOW: 2m
  QUEUE_DEPTH_INTERVAL: 30s
  OTEL_SERVICE_NAME: workflow-events-consumer
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_INSECURE: "false"
  OTEL_TRACES_SAMPLER_RATIO: "1.0"

# The queue/target/routing registry — rendered verbatim into a ConfigMap and
# mounted at env.TOPOLOGY_CONFIG_PATH. Same shape as config/topology.example.yaml.
# Override per-environment via a values-<env>.yaml file.
topology:
  version: 1
  targets:
    - name: execution
      addr: http://workflow-execution-service-api:8080
      pathPrefix: /api/v1/internal/events
    - name: definition
      addr: http://workflow-definition-service:8080
      pathPrefix: /api/v1/internal/events
    - name: workflow-stream-gateway
      addr: http://workflow-stream-gateway:8080
      pathPrefix: /api/v1/internal/events
  queues:
    - name: membership
      url: https://sqs.us-east-1.amazonaws.com/000000000000/membership-workflow-q
    - name: user
      url: https://sqs.us-east-1.amazonaws.com/000000000000/user-wf-q
    - name: delegation
      url: https://sqs.us-east-1.amazonaws.com/000000000000/delegation-workflow-q
    - name: dashboard
      url: https://sqs.us-east-1.amazonaws.com/000000000000/wf-workflow-dash-q
  routes:
    DelegationStarted: [execution]
    DelegationEnded: [execution]
    TenantStateChanged: [execution, definition]
    UserDeleted: [execution]
    UserAvailabilityChanged: [execution]
    DepartmentMembershipRevoked: [definition]
    MembershipRevoked: [definition, execution]
    TenantMembershipsPurged: [execution, definition]
    WorkflowTaskCreated: [workflow-stream-gateway, execution]
    WorkflowTaskClaimed: [workflow-stream-gateway]
    WorkflowTaskCompleted: [workflow-stream-gateway]
    WorkflowTaskDeferred: [workflow-stream-gateway]
    WorkflowTaskReassigned: [workflow-stream-gateway]
    WorkflowTaskSuperseded: [workflow-stream-gateway]
    WorkflowTaskFailed: [workflow-stream-gateway]
    WorkflowTaskSlaWarning: [workflow-stream-gateway]
    WorkflowTaskSlaBreached: [workflow-stream-gateway]
    WorkflowInstancePaused: [workflow-stream-gateway]
    WorkflowInstanceResumed: [workflow-stream-gateway]
    WorkflowInstanceCancelled: [workflow-stream-gateway]
    WorkflowInstanceTerminated: [workflow-stream-gateway]
    WorkflowInstanceDegraded: [workflow-stream-gateway]
    WorkflowInstanceFailed: [workflow-stream-gateway]
    WorkflowInstanceFinished: [workflow-stream-gateway]
    WorkflowInstanceStarted: []
    WorkflowInstanceForceRouted: []
    TenderAssigneeOverridden: []
    DepartmentMembershipGranted: []
    DepartmentMembershipLevelChanged: []

networkPolicy:
  enabled: true
  observabilityNamespace: observability
  targetPorts: [8080]
  additionalEgressRules: []

serviceMonitor:
  enabled: true
  namespace: ""
  interval: 30s
