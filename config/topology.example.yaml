# The queue/target/routing registry this service loads at startup (see
# internal/topology). Copy this file, fill in real queue URLs and target
# addresses, and point TOPOLOGY_CONFIG_PATH at it.
#
# No secrets belong in this file — a target's addr is not sensitive, and its
# own INTERNAL_API_TOKEN is only ever referenced by the environment variable
# name that holds it (tokenEnv), never stored here.
#
# Adding a queue, a downstream service, or a routing rule is a change to
# this file only — no Go code change, no rebuild, just a redeploy.

version: 1

# pathPrefix is each target's real registered internal-events base path.
# Every target below serves the same versioned /api/v1/internal/events
# convention today (execution_service, definition_service, and
# workflow-stream-gateway all converged on it) — pathPrefix defaults to that
# same value when omitted, so leaving it out is equivalent to spelling it out
# here, but a target on a different convention overrides it per-target
# instead of forcing a Go code change.
targets:
  - name: execution
    addr: http://workflow-execution-service-api:8080
    tokenEnv: EXECUTION_SERVICE_TOKEN
    pathPrefix: /api/v1/internal/events
  - name: definition
    addr: http://workflow-definition-service:8080
    tokenEnv: DEFINITION_SERVICE_TOKEN
    pathPrefix: /api/v1/internal/events
  - name: workflow-stream-gateway
    addr: http://workflow-stream-gateway:8080
    tokenEnv: WORKFLOW_STREAM_GATEWAY_TOKEN
    pathPrefix: /api/v1/internal/events

queues:
  - name: membership
    url: https://sqs.us-east-1.amazonaws.com/000000000000/membership-workflow-q
  - name: user
    url: https://sqs.us-east-1.amazonaws.com/000000000000/user-wf-q
  - name: delegation
    url: https://sqs.us-east-1.amazonaws.com/000000000000/delegation-workflow-q
  - name: dashboard
    url: https://sqs.us-east-1.amazonaws.com/000000000000/wf-workflow-dash-q

# An event type absent from this table falls back to broadcasting to every
# declared target above — a forward-compatibility safety net, not the
# steady-state behavior. Keep this in sync with each downstream service's
# own event catalogue; see docs/runbook.md.
#
# An event type listed with an EMPTY target list is dropped outright: it
# says "we know about this one and deliberately don't consume it", which the
# absent-from-the-table fallback cannot express. The IAM types at the bottom
# of this table are exactly that case: the filter policy of
# membership-workflow-q delivers them here whether or not anyone wants them.
#
# The 11 WorkflowTask* and WorkflowInstance* routes below feed
# workflow-stream-gateway (design/LLD/workflow_stream_gateway.md §3.1) —
# the wf-workflow-dash-q SNS filter-policy provisioning that actually
# delivers those 11 types onto the `dashboard` queue above is
# infra-provisioning tracked in that LLD's Appendix B, not done by this file.
# WorkflowInstanceStarted is deliberately absent (decided 2026-08-24):
# execution_service's own asyncapi.yaml documents it as not routed here —
# the creating client already knows synchronously.
#
# WorkflowTaskCreated also routes to execution — a connector-typed task's
# dispatch worker only ever receives it through this route, so routing this
# event to workflow-stream-gateway alone left connector dispatch entirely
# unreachable.
routes:
  DelegationStarted: [execution]
  DelegationEnded: [execution]
  # An offboarded status is acted on by both services: Execution terminates the
  # tenant's instances, Definition records the tenant for the purge of its
  # templates and credentials. Every other status is Execution's alone; Definition
  # acknowledges and ignores it.
  TenantStateChanged: [execution, definition]
  UserDeleted: [execution]
  UserAvailabilityChanged: [execution]
  DepartmentMembershipRevoked: [definition]
  # Tenant-level membership removal, distinct from the department-level event
  # above: IAM emits it unconditionally whenever a user is removed from a
  # tenant. Both services must react — Definition invalidates templates the
  # user is a default assignee on, Execution vacates their active
  # assignments — or a removed user keeps their tasks indefinitely.
  MembershipRevoked: [definition, execution]
  # IAM Core's tenant-offboarding cascade signal. Execution terminates the
  # tenant's non-terminal instances; Definition records the tenant for the
  # purge of its templates and credentials.
  TenantMembershipsPurged: [execution, definition]
  WorkflowTaskCreated: [workflow-stream-gateway, execution]
  WorkflowTaskCompleted: [workflow-stream-gateway]
  WorkflowTaskDeferred: [workflow-stream-gateway]
  WorkflowTaskReassigned: [workflow-stream-gateway]
  WorkflowTaskSlaWarning: [workflow-stream-gateway]
  WorkflowTaskSlaBreached: [workflow-stream-gateway]
  WorkflowInstancePaused: [workflow-stream-gateway]
  WorkflowInstanceResumed: [workflow-stream-gateway]
  WorkflowInstanceCancelled: [workflow-stream-gateway]
  WorkflowInstanceTerminated: [workflow-stream-gateway]
  WorkflowInstanceFinished: [workflow-stream-gateway]

  # IAM's delegation service publishes four types to iam.delegation.events,
  # delivered to delegation-workflow-q. Execution acts on Started and Ended;
  # no Workflow service consumes the review and escalation requests.
  DelegationReviewRequested: []
  DelegationEscalationRequested: []

  # Delivered by the membership-workflow-q filter policy, deliberately not consumed.
  # TenderAssigneeOverridden: per IAM's topology its only consumers are Audit
  # and Notification — Workflow applies the override synchronously through
  # its own node-override endpoint, never via the bus. The DepartmentMembership
  # Granted/LevelChanged pair feeds assignee pick-list surfaces nobody has
  # scoped yet; eligibility today is a live call, not a local cache.
  TenderAssigneeOverridden: []
  DepartmentMembershipGranted: []
  DepartmentMembershipLevelChanged: []
